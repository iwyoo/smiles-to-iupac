name: Tests

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pull requests skip the slow names; the weekly and manual runs cover everything
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pytest -q -m "not slow"
          else
            pytest -q
          fi
