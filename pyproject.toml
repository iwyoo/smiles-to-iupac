[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smiles-to-iupac"
dynamic = ["version"]
description = "Rule-based SMILES to IUPAC name conversion following the 2013 IUPAC recommendations (the Blue Book)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Inwan Yoo" },
]
keywords = ["chemistry", "cheminformatics", "iupac", "nomenclature", "smiles", "rdkit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "rdkit>=2023.9.1",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/iwyoo/smiles-to-iupac"
Repository = "https://github.com/iwyoo/smiles-to-iupac"
Issues = "https://github.com/iwyoo/smiles-to-iupac/issues"
Changelog = "https://github.com/iwyoo/smiles-to-iupac/blob/main/CHANGELOG.md"

[project.scripts]
smiles-to-iupac = "smiles_to_iupac.__main__:main"

[tool.hatch.version]
path = "src/smiles_to_iupac/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smiles_to_iupac"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/REFERENCES.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"
markers = ["slow: takes over a second to name; the pull-request run skips it (pytest -m 'not slow')"]
filterwarnings = ["ignore::smiles_to_iupac.NonPreferredNameWarning"]
