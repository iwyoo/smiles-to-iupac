[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemonym"
version = "0.1.0"
description = "Rule-based SMILES to IUPAC name conversion following the 2013 IUPAC recommendations (the Bluebook)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Inwan Yoo" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2023.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/iwyoo/chemonym"

[project.scripts]
chemonym = "chemonym.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chemonym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
