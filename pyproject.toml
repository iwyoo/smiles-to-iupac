[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smiles-to-iupac"
version = "0.1.0"
description = "Rule-based SMILES to IUPAC name conversion following the 2013 IUPAC recommendations (the Bluebook)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Inwan Yoo" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "rdkit>=2023.9.1",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/iwyoo/smiles-to-iupac"

[project.scripts]
smiles-to-iupac = "smiles_to_iupac.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smiles_to_iupac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::smiles_to_iupac.NonPreferredNameWarning"]
